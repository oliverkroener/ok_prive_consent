services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  OliverKroener\OkPriveConsent\:
    resource: '../Classes/*'

  # Registered via YAML tag: the #[AsEventListener] attribute requires TYPO3 13
  OliverKroener\OkPriveConsent\EventListener\InjectBannerScript:
    tags:
      - name: event.listener
        identifier: 'ok-prive-consent/inject-banner-script'
        event: TYPO3\CMS\Frontend\Event\AfterCacheableContentIsGeneratedEvent
